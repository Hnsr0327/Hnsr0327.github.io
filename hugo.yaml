baseURL: https://hnsr0327.github.io/
locale: zh-CN
title: Hanashiro's HolloWorld
enableRobotsTXT: true
buildDrafts: false
enableGitInfo: true
summaryLength: 40

frontmatter:
  lastmod: [lastmod, ':git', date]

params:
  author: Hanashiro
  avatar: /pictures/Hnsr.png
  email: hnsr@protonmail.com
  themeColor: "#dd3333"
  mainSections: [posts, notes]

menu:
  main:
    - name: 主页
      url: /
      weight: 10
    - name: 笔记
      url: /notes/
      weight: 20
  smart:
    - name: 所有文章
      url: /archives/
      weight: 10
    - name: 标签
      url: /tags/
      weight: 20

outputs:
  home: [HTML, RSS, JSON]

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
