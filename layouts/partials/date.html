<a href="{{ .Permalink }}" class="archive-article-date">
  <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}"><i class="icon-calendar icon"></i>{{ .Date.Format "2006-01-02" }}</time>{{ if and (ne (.Lastmod.Format "2006-01-02") (.Date.Format "2006-01-02")) (eq .Section "notes") }}
  <time datetime="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}"><i class="icon-calendar icon"></i>更新于 {{ .Lastmod.Format "2006-01-02" }}</time>{{ end }}{{ with .Params.status }}
  <span class="post-status">{{ . }}</span>{{ end }}
</a>
