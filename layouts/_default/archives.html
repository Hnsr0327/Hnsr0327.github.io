{{ define "main" }}
{{ $pages := where .Site.RegularPages "Section" "in" .Site.Params.mainSections }}
{{ range $pages.GroupByDate "2006" }}
<section class="archives-wrap">
  <div class="archive-year-wrap"><a class="archive-year">{{ .Key }}</a></div>
  <div class="archives">
    {{ range .Pages }}
    <article class="archive-article archive-type-post">
      <div class="archive-article-inner">
        <header class="archive-article-header">
          <div class="article-meta">{{ partial "date.html" . }}</div>
          <h1><a class="archive-article-title" href="{{ .RelPermalink }}">{{ .Title }}</a></h1>
          <div class="article-info info-on-right">{{ partial "tags.html" . }}</div>
          <div class="clearfix"></div>
        </header>
      </div>
    </article>
    {{ end }}
  </div>
</section>
{{ end }}
{{ end }}
